name: Medical Bot Auto Agent

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-medical-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Medical Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
        run: python main.py

      - name: Save memory files
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # اضافه کردن فایل‌هایی که وجود دارن
          FILES_TO_ADD=""
          if [ -f "seen_articles.json" ]; then
            FILES_TO_ADD="$FILES_TO_ADD seen_articles.json"
          fi
          if [ -f "translation_cache.json" ]; then
            FILES_TO_ADD="$FILES_TO_ADD translation_cache.json"
          fi

          if [ -z "$FILES_TO_ADD" ]; then
            echo "📭 هیچ فایلی برای ذخیره وجود ندارد"
            exit 0
          fi

          git add $FILES_TO_ADD

          if git diff --staged --quiet; then
            echo "📭 تغییری نیست"
          else
            git commit -m "update memory [skip ci]"
            git push
            echo "✅ حافظه به‌روزرسانی شد"
          fi